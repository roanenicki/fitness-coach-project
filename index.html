<!doctype html>
<html lang="fr">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta
        name="theme-color"
        content="#16a36a"
    >

    <meta
        name="description"
        content="Connexion à Fitness Coach — espace coach et athlète"
    >

    <title>
        Fitness Coach — Connexion
    </title>


    <!-- =====================================================
         POLICE
         ===================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         ICÔNES
         ===================================================== -->

    <script
        src="https://unpkg.com/lucide@latest"
    ></script>


    <!-- =====================================================
         STYLE
         ===================================================== -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body class="auth-page">


    <!-- =====================================================
         ARRIÈRE-PLAN
         ===================================================== -->

    <div class="auth-background">

        <div class="auth-orb auth-orb-green"></div>

        <div class="auth-orb auth-orb-orange"></div>

    </div>



    <!-- =====================================================
         CONTENEUR
         ===================================================== -->

    <main
        class="auth-shell"
        aria-labelledby="loginTitle"
    >


        <!-- =================================================
             CARTE DE CONNEXION
             ================================================= -->

        <section class="auth-card">


            <!-- ---------------------------------------------
                 LOGO
                 --------------------------------------------- -->

            <div class="auth-brand">


                <div class="auth-brand-icon">

                    <i data-lucide="activity"></i>

                </div>


                <div>

                    <strong>
                        Fitness Coach
                    </strong>

                    <span>
                        Coaching &amp; progression
                    </span>

                </div>


            </div>



            <!-- ---------------------------------------------
                 TITRE
                 --------------------------------------------- -->

            <div class="auth-heading">


                <span class="auth-kicker">

                    <i data-lucide="lock-keyhole"></i>

                    ESPACE SÉCURISÉ

                </span>


                <h1 id="loginTitle">
                    Bienvenue
                </h1>


                <p class="muted">

                    Connectez-vous pour accéder à
                    votre espace personnel.

                </p>


            </div>



            <!-- =================================================
                 FORMULAIRE
                 ================================================= -->

            <form id="loginForm">


                <!-- ---------------------------------------------
                     EMAIL
                     --------------------------------------------- -->

                <label for="email">

                    <span class="input-label">

                        <i data-lucide="mail"></i>

                        Email

                    </span>


                    <input
                        id="email"
                        name="email"
                        type="email"
                        required
                        autocomplete="email"
                        inputmode="email"
                        placeholder="votre@email.com"
                    >

                </label>



                <!-- ---------------------------------------------
                     MOT DE PASSE
                     --------------------------------------------- -->
                <label class="password-field">
                Mot de passe

                <div class="password-input-wrap">
                    <input
                    id="password"
                    type="password"
                    autocomplete="current-password"
                    required
                    >

                    <button
                    id="toggleLoginPassword"
                    class="password-toggle"
                    type="button"
                    aria-label="Afficher le mot de passe"
                    title="Afficher le mot de passe"
                    >
                    <i data-lucide="eye"></i>
                    </button>
                </div>
                </label>

                <!-- ---------------------------------------------
                     CONNEXION
                     --------------------------------------------- -->

                <button
                    id="loginBtn"
                    class="primary auth-submit"
                    type="submit"
                >

                    <i data-lucide="log-in"></i>

                    <span>
                        Se connecter
                    </span>

                </button>



                <!-- ---------------------------------------------
                     MESSAGE
                     --------------------------------------------- -->

                <p
                    id="message"
                    class="message"
                    role="alert"
                    aria-live="polite"
                ></p>


            </form>



            <!-- ---------------------------------------------
                 INFORMATIONS
                 --------------------------------------------- -->

            <div class="auth-footer">


                <span>

                    <i data-lucide="shield-check"></i>

                    Connexion sécurisée

                </span>


                <span class="auth-separator">
                    •
                </span>


                <span>
                    Coach &amp; Athlète By Michael
                </span>


            </div>


        </section>


    </main>



    <!-- =====================================================
         SUPABASE
         ===================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>



    <!-- =====================================================
         CONFIGURATION
         ===================================================== -->

    <script src="js/config.js"></script>



    <!-- =====================================================
         AUTHENTIFICATION
         ===================================================== -->

    <script src="js/auth.js"></script>



    <!-- =====================================================
         ICÔNES
         ===================================================== -->

    <script>

        if (
            typeof lucide !== "undefined"
        ) {

            lucide.createIcons();

        }

    </script>


</body>

</html>
