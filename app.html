<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FitTrack — Ma séance</title><link rel="stylesheet" href="css/style.css"></head><body><header class="topbar"><div class="brand small">FIT<span>TRACK</span></div><button id="logout" class="ghost">Déconnexion</button></header><main class="container"><section class="hero"><p class="eyebrow">ESPACE SPORTIVE</p><h1 id="greeting">Bonjour 👋</h1><p class="muted" id="today"></p></section><section id="startView" class="card"><div class="session-head"><div><span class="pill">Semaine <b id="weekNo">1</b></span><h2 id="workoutTitle">Séance du jour</h2><p id="workoutDesc" class="muted"></p></div><div class="timer" id="timer">00:00:00</div></div><div id="exerciseList" class="exercise-list"></div><div class="start-row"><label class="compact">Énergie avant<input id="energyBefore" type="number" min="1" max="10" value="7"></label><button id="startBtn" class="primary big">▶ Commencer la séance</button></div></section><section id="activeView" class="card hidden"><div class="session-head"><div><span class="pill live">● EN COURS</span><h2 id="activeTitle"></h2></div><div class="timer" id="activeTimer">00:00:00</div></div><div id="activeExercises" class="exercise-list"></div><button id="finishBtn" class="danger big">✓ Terminer la séance</button></section><section id="finishView" class="card hidden"><h2>🎉 Séance terminée</h2><p id="finishSummary" class="muted"></p><div class="form-grid"><label>Énergie après<input id="energyAfter" type="number" min="1" max="10" value="8"></label><label>Difficulté<input id="difficulty" type="number" min="1" max="10" value="6"></label></div><label>Commentaire<textarea id="notes" rows="4" placeholder="Comment s'est passée la séance ?"></textarea></label><button id="saveFinish" class="primary big">Enregistrer la séance</button></section><section class="card"><div class="section-title"><h2>Mon historique</h2><span id="stats" class="pill"></span></div><div id="history"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="data/programme.js"></script><script src="js/auth.js"></script><script src="js/app.js"></script></body></html>
